<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Lizard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module" defer></script>
</head>
<body>
    <header>
        <h1>Clicker Lizard</h1>
    </header>
    <main>
        <div class="tela1">
                <div class="upgrade-container">
                    <h2>Upgrades</h2>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpLeveis">Aumente seu Level</span>
                        <span class="valor" id="valorUpLeveis">5000</span>
                        <button id="buttonUpLeveis">+1</button>
                        <span class="nivel" id="nivelUpLeveis">1</span>
                    </div>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpPontos">Aumente seu ganho de Pontos</span>
                        <span class="valor" id="valorUpPontos">10</span>
                        <button id="buttonUpPontos">+1</button>
                        <span class="nivel" id="nivelUpPontos">1</span>
                    </div>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpAutoC">Auto Click</span>
                        <span class="valor" id="valorUpAutoC">10</span>
                        <button id="buttonUpAutoC">+1</button>
                        <span class="nivel" id="nivelUpAutoC">0</span>
                    </div>
                </div>
        </div>
        <div class="tela2">
            <span id="spanPontos">0</span>
            <button id="buttonPontos">Clique Aqui!</button>
        </div>
        <div class="tela3">

        </div>
    </main>
    <footer>
        <span>&copy; Todos os Direitos Reservados | Zduardo </span>
    </footer>
</body>
</html>
