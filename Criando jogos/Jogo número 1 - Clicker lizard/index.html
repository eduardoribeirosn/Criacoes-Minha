<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Lizard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module" defer></script>
</head>
<body>
    <header>
        <h1>Clicker Lizard</h1>
    </header>
    <main>
        <div class="tela1">
                <div class="upgrade-container">
                    <h2>Upgrades</h2>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpLeveis" title="Descrição do Upgrade">Aumente seu Level</span>
                        <span class="valor" id="valorUpLeveis" title="Valor para upar">5000</span>
                        <button id="buttonUpLeveis" title="Botão para Upar">+1</button>
                        <span class="nivel" id="nivelUpLeveis" title="Nível atual">1</span>
                    </div>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpPontos" title="Descrição do Upgrade">Aumente seu ganho de Pontos</span>
                        <span class="valor" id="valorUpPontos" title="Valor para upar">10</span>
                        <button id="buttonUpPontos" title="Botão para Upar">+1</button>
                        <span class="nivel" id="nivelUpPontos" title="Nível atual">1</span>
                    </div>

                    <div class="upgrade-item">
                        <span class="descricao" id="spanUpAutoC" title="Descrição do Upgrade">Auto Click</span>
                        <span class="valor" id="valorUpAutoC" title="Valor para upar">10</span>
                        <button id="buttonUpAutoC" title="Botão para Upar">+1</button>
                        <span class="nivel" id="nivelUpAutoC" title="Nível atual">0</span>
                    </div>
                </div>
        </div>
        <div class="tela2">
            <span id="spanPontos">0</span>
            <button id="buttonPontos">Clique Aqui!</button>
        </div>
        <div class="tela3">
            <!-- <button id="buttonStatsOpen"><img src="./img/swords_50dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="Botão dos Stats"></button> -->
            <div class="areaStats">
                <button id="buttonStatsClose"><img src="./img/swords_50dp_E3E3E3_FILL0_wght400_GRAD0_opsz48.png" alt="Botão dos Stats"></button>
                <h2>Stats</h2>

                <div class="statsItem">
                    <span class="descricao" id="spanUpDano">Dano:</span>
                    <span>50</span>
                    <span>5000</span>
                    <button>+1</button>
                    <span>50</span>
                </div>
                <div class="statsItem">
                    <span class="descricao" id="spanUpVida">Vida:</span>

                </div>
                <div class="statsItem">
                    <span class="descricao" id="spanUpDefesa">Defesa:</span>

                </div>
                
            </div>
        </div>
    </main>
    <footer>
        <span>&copy; Todos os Direitos Reservados | Zduardo </span>
    </footer>
</body>
</html>
