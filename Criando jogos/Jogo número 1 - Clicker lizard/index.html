<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Lizard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Clicker Lizard</h1>
    </header>
    <main>
        <div class="tela1">
            <span id="spanUpPontos">Aumente seu ganho de Pontos: </span>
            <span id="valorUpPontos">10</span>
            <button id="buttonUpPontos" onclick="upgradePonts()">+1</button>
        </div>
        <div class="tela2">
            <span id="spanPontos">0</span>
            <button id="buttonPontos" onclick="clickButtonPonts()">Clique Aqui!</button>
        </div>
        <div class="tela3">

        </div>
    </main>
    <footer>
        <span>&copy; Todos os Direitos Reservados | Zduardo </span>
    </footer>
</body>
</html>
