<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Lizard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Clicker Lizard</h1>
    </header>
    <main>
        <div class="tela1">
                
            <table>
                <caption>Upgrades</caption>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Botão</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span id="spanUpPontos">Aumente seu ganho de Pontos </span></td>
                        <td><span id="valorUpPontos">10</span></td>
                        <td><button id="buttonUpPontos" onclick="upgradePonts()">+1</button></td>
                    </tr>
                    <tr>
                        <td><span id="">Auto Click </span></td>
                        <td><span id="">Auto Click </span></td>
                        <td><button id="" onclick="">+1</button></td>
                    </tr>
                </tbody>
            </table>   
        </div>
        <div class="tela2">
            <span id="spanPontos">0</span>
            <button id="buttonPontos" onclick="clickButtonPonts()">Clique Aqui!</button>
        </div>
        <div class="tela3">

        </div>
    </main>
    <footer>
        <span>&copy; Todos os Direitos Reservados | Zduardo </span>
    </footer>
</body>
</html>
